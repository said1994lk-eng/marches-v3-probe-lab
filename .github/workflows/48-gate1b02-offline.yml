name: "48 - Gate 1B-02 Offline Evidence Tests"
on:
  push:
    paths:
      - ".github/workflows/48-gate1b02-offline.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and all regression tests (NO portal requests)
        run: |
          python -m py_compile src/gate1b_attestation.py src/gate1b02_dom_evidence.py src/gate1b02_probe.py
          python -m unittest discover -s tests -v
          echo 'GATE1B02_OFFLINE_VALIDATED'
