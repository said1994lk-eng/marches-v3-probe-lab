name: "52 - Gate 1B-02 Detail Readiness (offline only)"
on:
  push:
    paths:
      - ".github/workflows/52-gate1b02-detail-readiness-offline.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and run full offline regression suite
        run: |
          python -m py_compile src/gate1b02_detail_readiness.py src/gate1b02_dom_evidence.py src/gate1b02_detail_parser.py src/gate1b02_probe.py
          python -m unittest discover -s tests -q
      - name: Install Chromium ONLY for local HTML fixtures
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify detail parser fixtures with local HTML
        run: |
          python tests/gate1b02_browser_fixture.py
      - name: Verify late-loaded category and sanitized readiness metadata locally
        run: |
          python tests/gate1b02_readiness_browser_fixture.py
