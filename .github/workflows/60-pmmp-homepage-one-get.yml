name: "60 - Current PMMP Homepage Connectivity (one public GET)"
on:
  push:
    paths:
      - ".github/workflows/60-pmmp-homepage-one-get.yml"

permissions:
  contents: read

concurrency:
  group: pmmp-homepage-single-limited-check
  cancel-in-progress: false

jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and all offline regression tests
        run: |
          python -m py_compile src/pmmp_homepage_connection_canary.py
          python -m unittest discover -s tests -q
      - name: Install Chromium without OS dependency changes
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: One public homepage visit; no searches or actions
        shell: bash
        env:
          ENABLE_ONE_LIVE_PMMP_HOMEPAGE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p artifacts
          set -o pipefail
          python src/pmmp_homepage_connection_canary.py 2>&1 | tee artifacts/homepage_console.log
      - name: Preserve sanitized JSON
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("artifacts/homepage_console.log")
          s=p.read_text(encoding="utf-8",errors="replace") if p.exists() else ""
          a,b="BEGIN_PMMP_HOME_JSON","END_PMMP_HOME_JSON"
          if a in s and b in s.split(a,1)[1]:
              try:
                  d=json.loads(s.split(a,1)[1].split(b,1)[0].strip())
              except (ValueError,IndexError):
                  d={"schema":"pmmp-home-wrapper/1","status":"INVALID_JSON"}
          else:
              d={"schema":"pmmp-home-wrapper/1","status":"PROBE_JSON_NOT_EMITTED"}
          Path("artifacts/pmmp-home-result.json").write_text(
              json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmmp-homepage-connectivity-20261112
          path: artifacts/pmmp-home-result.json
          retention-days: 5
          if-no-files-found: error
