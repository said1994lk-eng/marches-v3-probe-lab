name: "43 - Gate 1A-06 Blank Timeout and Fournitures Evidence (single run)"
on:
  push:
    paths:
      - ".github/workflows/43-gate1a06-once.yml"

permissions:
  contents: read

concurrency:
  group: gate1a06-one-bounded-readonly-check
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all Python regressions before any portal request
        run: |
          python -m py_compile src/navigation_destination.py src/navigation_recovery.py src/page_state.py src/category_evidence.py src/filter_evidence_gate1a04.py src/gate1a04_probe.py
          python -m unittest discover -s tests -q
      - name: Install bounded Chromium runner
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run one read-only public navigation and category probe
        shell: bash
        env:
          ENABLE_LIVE_GATE1A04: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p artifacts
          set -o pipefail
          python src/gate1a04_probe.py 2>&1 | tee artifacts/gate1a06-console.log
      - name: Save sanitized JSON even if probe fails
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/gate1a06-console.log")
          s = p.read_text(encoding="utf-8", errors="replace") if p.exists() else ""
          start, end = "BEGIN_GATE1A04_JSON", "END_GATE1A04_JSON"
          if start in s and end in s.split(start,1)[1]:
              raw = s.split(start,1)[1].split(end,1)[0].strip()
              try:
                  report = json.loads(raw)
              except json.JSONDecodeError:
                  report = {"schema": "gate1a06-wrapper/1", "status": "INVALID_JSON"}
          else:
              report = {"schema": "gate1a06-wrapper/1", "status": "PROBE_JSON_NOT_EMITTED"}
          Path("artifacts/gate1a06-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          PY
      - name: Publish evidence (no raw page content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1a06-sanitized-search-evidence
          path: artifacts/gate1a06-report.json
          retention-days: 3
          if-no-files-found: error
